openapi: 3.0.3

info:
  title: "Senior Java Tech Challenge"
  version: "1.0.0"
  contact:
    name: "SUSANA FIGUEROA"
    email: "sufigueroa@proton.me"

tags:
  - name: Products
    description: Product and price management operations.

paths:
  /products:
    post:
      tags:
        - Products
      summary: Create a new product.
      description: Creates a product without initial prices.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
            example:
              name: "Sports shoes"
              description: "Limited edition 2025 model"
      responses:
        "201":
          description: Product created successfully.
          headers:
            Location:
              description: URL of the created product.
              schema:
                type: string
                example: "/products/1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/{id}/prices:
    parameters:
      - $ref: "#/components/parameters/ProductId"

    post:
      tags:
        - Products
      summary: Add a price to a product.
      description: >
        Adds a price period to an existing product. The period must not
        overlap with another price period belonging to the same product.
        When endDate is provided, it must be later than initDate.
      operationId: addProductPrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePriceInput"
            example:
              value: 99.99
              initDate: "2024-01-01"
              endDate: "2024-06-30"
      responses:
        "201":
          description: Price added successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "409":
          description: The price period overlaps with an existing price period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 409
                error: "Conflict"
                message: "The price period overlaps with an existing price period."
                path: "/products/1/prices"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags:
        - Products
      summary: Get the complete price history of a product.
      description: Returns the product information and all its price periods.
      operationId: getProductPriceHistory
      responses:
        "200":
          description: Product price history retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPriceHistory"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/{id}/price:
    get:
      tags:
        - Products
      summary: Get the product price applicable on a specific date.
      description: >
        Returns the single price whose validity period includes the requested date.
      operationId: getProductPriceByDate
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - name: date
          in: query
          required: true
          description: Date for which the applicable product price is requested.
          schema:
            type: string
            format: date
          example: "2024-04-15"
      responses:
        "200":
          description: Applicable product price retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicablePrice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Product or applicable price not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                error: "Not Found"
                message: "No applicable price was found for the requested date."
                path: "/products/1/price"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Auto-generated product identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 400
            error: "Bad Request"
            message: "The request contains invalid data."
            path: "/products"

    ProductNotFound:
      description: Product not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 404
            error: "Not Found"
            message: "Product with identifier 1 was not found."
            path: "/products/1/prices"

    InternalServerError:
      description: An unexpected internal error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 500
            error: "Internal Server Error"
            message: "An unexpected error occurred."
            path: "/products"

  schemas:
    CreateProductInput:
      title: CreateProductInput
      type: object
      additionalProperties: false
      description: Request used to create a new product.
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Product name.
          example: "Sports shoes"
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: Product description.
          example: "Limited edition 2025 model"

    Product:
      title: Product
      type: object
      additionalProperties: false
      description: Product information.
      required:
        - id
        - name
        - description
        - prices
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Auto-generated product identifier.
          example: 1
        name:
          type: string
          example: "Sports shoes"
        description:
          type: string
          example: "Limited edition 2025 model"
        prices:
          type: array
          description: Product price periods. Initially, this collection is empty.
          items:
            $ref: "#/components/schemas/Price"
          example: []

    CreatePriceInput:
      title: CreatePriceInput
      type: object
      additionalProperties: false
      description: Request used to add a price to a product.
      required:
        - value
        - initDate
      properties:
        value:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Monetary value of the product price.
          example: 99.99
        initDate:
          type: string
          format: date
          description: First date on which the price is applicable.
          example: "2024-01-01"
        endDate:
          type: string
          format: date
          nullable: true
          description: >
            Last date on which the price is applicable. A null value indicates
            that the price has no defined end date.
          example: "2024-06-30"

    Price:
      title: Price
      type: object
      additionalProperties: false
      description: Product price and its validity period.
      required:
        - value
        - initDate
        - endDate
      properties:
        value:
          type: number
          format: decimal
          multipleOf: 0.01
          description: Monetary value of the product price.
          example: 99.99
        initDate:
          type: string
          format: date
          description: First date on which the price is applicable.
          example: "2024-01-01"
        endDate:
          type: string
          format: date
          nullable: true
          description: Last date on which the price is applicable.
          example: "2024-06-30"

    ApplicablePrice:
      title: ApplicablePrice
      type: object
      additionalProperties: false
      description: Product price applicable on the requested date.
      required:
        - value
      properties:
        value:
          type: number
          format: decimal
          multipleOf: 0.01
          example: 99.99

    ProductPriceHistory:
      title: ProductPriceHistory
      type: object
      additionalProperties: false
      description: Product information with its complete price history.
      required:
        - name
        - description
        - prices
      properties:
        name:
          type: string
          example: "Sports shoes"
        description:
          type: string
          example: "Limited edition 2025 model"
        prices:
          type: array
          description: Complete collection of product price periods.
          items:
            $ref: "#/components/schemas/Price"
          example:
            - value: 99.99
              initDate: "2024-01-01"
              endDate: "2024-06-30"
            - value: 199.99
              initDate: "2025-01-01"
              endDate: "2025-06-30"

    ApiError:
      title: ApiError
      type: object
      additionalProperties: false
      description: Standard API error response.
      required:
        - status
        - error
        - message
        - path
      properties:
        status:
          type: integer
          format: int32
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "The request contains invalid data."
        path:
          type: string
          example: "/products"